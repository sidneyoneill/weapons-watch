services:
  - type: web
    runtime: python
    name: arms-trade-dashboard-api
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://arms-trade-dashboard.onrender.com

  - type: web
    runtime: static
    name: arms-trade-dashboard
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://arms-trade-dashboard-api.onrender.com
